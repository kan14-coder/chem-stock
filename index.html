<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ตรวจสอบสต็อกสารเคมี</title>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body { font-family: sans-serif; margin: 0; padding: 16px; background: #f2f4f7; color: #222; }

    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    .center { text-align: center; }

    h2 { margin: 0 0 10px; font-size: 22px; }

    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 18px; }

    label { display: block; margin: 12px 0 6px; font-size: 16px; }

    input { width: 100%; font-size: 24px; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }

    .toggle { display: flex; gap: 8px; }

    .tbtn { flex: 1; font-size: 18px; padding: 12px; border: 2px solid #ccc; border-radius: 8px; background: #fff; color: #555; }

    .tbtn.active-in  { border-color: #06c755; background: #e8f9ef; color: #06a046; font-weight: bold; }

    .tbtn.active-out { border-color: #ff9800; background: #fff4e5; color: #e68900; font-weight: bold; }

    .btn { display: block; width: 100%; font-size: 20px; padding: 14px; border: none; border-radius: 8px; margin-top: 10px; color: #fff; }

    .btn:disabled { opacity: .5; }

    .btn-save  { background: #06c755; }

    .btn-again { background: #1976d2; }

    .btn-scan  { background: #2196f3; }

    .btn-close { background: #616161; }

    .ok  { color: #06a046; font-size: 26px; font-weight: bold; margin-bottom: 8px; }

    .err { color: #d32f2f; font-size: 18px; margin-top: 10px; text-align: center; }


    /* กล่องสถานที่จัดเก็บ */

    .loc-box { background: #e3f2fd; border: 2px solid #1976d2; border-radius: 10px; padding: 10px 12px; margin: 8px 0 4px; text-align: left; }

    .loc-label { font-size: 15px; color: #1565c0; }

    .loc-value { font-size: 22px; font-weight: bold; color: #0d47a1; }


    /* แจ้งเตือนสต็อกต่ำ: สีแดง ตัวใหญ่ */

    .low-alert {

      color: #ff0000; font-size: 32px; font-weight: bold; text-align: center; line-height: 1.4;

      border: 4px solid #ff0000; border-radius: 12px; padding: 18px; margin-bottom: 12px; background: #fff0f0;

    }

    .hidden { display: none !important; }

  </style>

</head>

<body>


  <div id="statusView" class="card center">กำลังโหลด...</div>


  <!-- หน้าทำรายการ -->

  <div id="formView" class="hidden">

    <div id="lowNow" class="low-alert hidden"></div>

    <div class="card">

      <h2 id="fName"></h2>

      <div class="loc-box">

        <div class="loc-label">📍 สถานที่จัดเก็บ</div>

        <div class="loc-value" id="fLoc"></div>

      </div>

      <div class="row"><span>รหัส</span><b id="fCode"></b></div>

      <div class="row"><span>คงเหลือ</span><b id="fBalance"></b></div>

      <div class="row"><span>จุดต่ำสุด</span><b id="fMin"></b></div>


      <label>ประเภทรายการ</label>

      <div class="toggle">

        <button id="tIn"  class="tbtn" onclick="setType('in')">รับเข้า</button>

        <button id="tOut" class="tbtn" onclick="setType('out')">เบิกออก</button>

      </div>


      <label>จำนวน</label>

      <input id="qty" type="number" min="0" step="any" inputmode="decimal" placeholder="ใส่จำนวน">


      <button id="saveBtn" class="btn btn-save" onclick="save()">บันทึก</button>

      <div id="formMsg" class="err"></div>

    </div>

  </div>


  <!-- หน้าผลลัพธ์หลังบันทึก -->

  <div id="resultView" class="hidden">

    <div id="lowAfter" class="low-alert hidden"></div>

    <div class="card center">

      <div class="ok">✅ บันทึกสำเร็จ</div>

      <div id="rDetail" style="font-size:18px;margin-bottom:8px;"></div>

      <div class="loc-box">

        <div class="loc-label">📍 สถานที่จัดเก็บ</div>

        <div class="loc-value" id="rLoc"></div>

      </div>

      <div class="row"><span>สารเคมี</span><b id="rName"></b></div>

      <div class="row"><span>คงเหลือปัจจุบัน</span><b id="rBalance"></b></div>

      <div class="row"><span>จุดต่ำสุด</span><b id="rMin"></b></div>

    </div>

    <button class="btn btn-again" onclick="backToForm()">ทำรายการนี้อีกครั้ง</button>

  </div>


  <button class="btn btn-scan" onclick="scan()">📷 สแกน QR รายการอื่น</button>

  <button class="btn btn-close" onclick="closeApp()">ปิดหน้าจอ</button>


<script>

  // ===== แก้ 2 บรรทัดนี้ (ใช้ค่าเดิมจากไฟล์เก่า) =====

  const LIFF_ID = "2012261459-EWoSIMD4";

  const GAS_URL = "https://script.google.com/macros/s/AKfycbzGVChyiQvWHNw3gihvEX96LDakfV40k5DWFIDRSCS3E4jijhGN6nUOWnnVBXoP7Gop/exec";

  // ===================================================


  const LOW_TEXT = "⚠️ ปริมาณคงเหลือต่ำกว่าขั้นต่ำ ต้องสั่งซื้อ";

  const NO_LOCATION_TEXT = "ยังไม่ระบุ";


  let currentCode = "";

  let currentType = "out";

  let userName = "LIFF";

  let busy = false;


  async function main() {

    document.getElementById("lowNow").textContent = LOW_TEXT;

    document.getElementById("lowAfter").textContent = LOW_TEXT;


    if (typeof liff === "undefined") {

      showStatus("โหลด LINE SDK ไม่สำเร็จ กรุณาเปิดผ่านลิงก์ LIFF (https://liff.line.me/LIFF_ID?code=รหัส) และตรวจอินเทอร์เน็ต", true);

      return;

    }

    if (LIFF_ID.indexOf("ใส่") === 0 || GAS_URL.indexOf("ใส่") === 0) {

      showStatus("ยังไม่ได้ใส่ LIFF_ID หรือ GAS_URL ในไฟล์ index.html", true);

      return;

    }


    try {

      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {

        liff.login({ redirectUri: location.href });

        return;

      }

      try {

        const profile = await liff.getProfile();

        userName = profile.displayName;

      } catch (e) { /* ใช้ชื่อเริ่มต้น */ }


      const code = new URLSearchParams(location.search).get("code");

      if (code) {

        loadItem(code);

      } else {

        showStatus("กดปุ่ม 📷 สแกน QR เพื่อเริ่มทำรายการ");

      }

    } catch (err) {

      showStatus("เริ่มต้นไม่สำเร็จ: " + err.message, true);

    }

  }


  async function callApi(data) {

    data.app = "stockqr";

    const res = await fetch(GAS_URL, {

      method: "POST",

      headers: { "Content-Type": "text/plain;charset=utf-8" },

      body: JSON.stringify(data)

    });

    const json = await res.json();

    if (!json.ok) throw new Error(json.error || "เกิดข้อผิดพลาด");

    return json;

  }


  async function loadItem(code) {

    showStatus("กำลังโหลดข้อมูล...");

    try {

      const r = await callApi({ action: "get", code: code });

      currentCode = code;

      fillForm(r.item);

      show("formView");

    } catch (err) {

      showStatus(err.message, true);

    }

  }


  function locText(item) {

    return item.location ? item.location : NO_LOCATION_TEXT;

  }


  function fillForm(item) {

    document.getElementById("fName").textContent = item.name;

    document.getElementById("fLoc").textContent = locText(item);

    document.getElementById("fCode").textContent = item.code || "-";

    document.getElementById("fBalance").textContent = item.balance;

    document.getElementById("fMin").textContent = item.minStock === null ? "-" : item.minStock;

    document.getElementById("lowNow").classList.toggle("hidden", !item.low);

    document.getElementById("qty").value = "";

    document.getElementById("formMsg").textContent = "";

    setType(currentType);

  }


  function setType(type) {

    currentType = type;

    document.getElementById("tIn").className  = "tbtn" + (type === "in"  ? " active-in"  : "");

    document.getElementById("tOut").className = "tbtn" + (type === "out" ? " active-out" : "");

  }


  async function save() {

    if (busy) return;

    const msg = document.getElementById("formMsg");

    const qty = Number(document.getElementById("qty").value);

    if (!(qty > 0)) {

      msg.textContent = "กรุณาใส่จำนวนที่มากกว่า 0";

      return;

    }


    busy = true;

    const btn = document.getElementById("saveBtn");

    btn.disabled = true;

    btn.textContent = "กำลังบันทึก...";

    msg.textContent = "";


    try {

      const r = await callApi({ action: currentType, code: currentCode, qty: qty, userName: userName });

      showResult(r.item, qty);

    } catch (err) {

      msg.textContent = err.message;

    } finally {

      busy = false;

      btn.disabled = false;

      btn.textContent = "บันทึก";

    }

  }


  function showResult(item, qty) {

    document.getElementById("rDetail").textContent =

      (currentType === "in" ? "รับเข้า " : "เบิกออก ") + qty + " โดย " + userName;

    document.getElementById("rLoc").textContent = locText(item);

    document.getElementById("rName").textContent = item.name;

    document.getElementById("rBalance").textContent = item.balance;

    document.getElementById("rMin").textContent = item.minStock === null ? "-" : item.minStock;

    document.getElementById("lowAfter").classList.toggle("hidden", !item.low);


    fillForm(item);

    show("resultView");

    window.scrollTo(0, 0);

  }


  function backToForm() {

    show("formView");

  }


  async function scan() {

    if (typeof liff === "undefined") return;

    try {

      const result = await liff.scanCodeV2();

      let code = (result.value || "").trim();

      try {

        const url = new URL(code);

        code = url.searchParams.get("code") || code;

      } catch (e) { /* QR เป็นรหัสธรรมดา */ }

      if (code) loadItem(code);

    } catch (err) {

      alert("สแกนไม่สำเร็จ: " + err.message);

    }

  }


  // ปิดหน้าจอเฉพาะเมื่อผู้ใช้กดปุ่มเท่านั้น

  function closeApp() {

    if (typeof liff !== "undefined" && liff.isInClient()) {

      liff.closeWindow();

    } else {

      window.close();

      alert("กรุณาปิดแท็บนี้ด้วยตนเอง");

    }

  }


  function show(id) {

    ["statusView", "formView", "resultView"].forEach(v =>

      document.getElementById(v).classList.toggle("hidden", v !== id));

  }


  function showStatus(text, isError) {

    const el = document.getElementById("statusView");

    el.textContent = text;

    el.style.color = isError ? "#d32f2f" : "";

    show("statusView");

  }


  main();

</script>

</body>

</html>
